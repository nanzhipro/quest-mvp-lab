[package]
name = "esmvp-rs"
version = "0.1.0"
edition = "2024"
description = "Directory-scoped AUTH_OPEN enforcement via Endpoint Security muting inversion (see ../SPEC.md)"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
mime_guess = "2"
signal-hook = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

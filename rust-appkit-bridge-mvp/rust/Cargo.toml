[package]
name = "bridge-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
# 与 platform-macos 完全一致的版本组合（cua-driver Cargo.lock 实测锁定）
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = [
    "NSString", "NSArray", "NSDictionary", "NSNotification", "NSObject",
    "NSRunLoop", "NSThread", "NSOperation", "NSURL", "NSError", "NSValue",
    "block2", "libc",
] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication", "NSWindow", "NSScreen", "NSRunningApplication",
    "NSWorkspace", "NSView", "block2", "libc",
] }
block2 = "0.5.1"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"
libc = "0.2"
serde_json = "1"

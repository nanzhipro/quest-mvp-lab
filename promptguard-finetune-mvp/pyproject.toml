[project]
name = "promptguard-finetune-mvp"
version = "0.1.0"
description = "Fine-tuning PromptGuard 2 (86M) on LLM-generated synthetic injection data to fix domain false positives, for the ADR agent scenario"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.6",
    "transformers>=4.48,<5",
    "accelerate>=1.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[package]
name = "readonly-fs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Read-only, workspace-confined filesystem MCP server (stdio, local-only)"
publish = false

[lib]
name = "readonly_fs_mcp"
path = "src/lib.rs"

[[bin]]
name = "readonly-fs-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.4", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }

[dev-dependencies]
rmcp = { version = "3.4", features = ["client", "transport-child-process"] }
tempfile = "3"
tokio = { version = "1", features = ["process", "time", "test-util"] }

[profile.release]
lto = "thin"
strip = true

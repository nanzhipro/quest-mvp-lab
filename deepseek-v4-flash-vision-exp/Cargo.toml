[package]
name = "ds-vision"
version = "0.1.0"
edition = "2021"
description = "MVP: validate DeepSeek deepseek-v4-flash-vision-exp multimodal capabilities (understanding, creation, generation probe) with local test images"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
httpmock = "0.7"

[profile.release]
strip = true

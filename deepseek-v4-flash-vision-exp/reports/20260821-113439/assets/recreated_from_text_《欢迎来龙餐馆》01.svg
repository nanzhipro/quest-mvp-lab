  <text x="730" y="80" font-family="'SimSun',serif" font-size="16" fill="#1A1A2E" text-anchor="middle" font-weight="bold">领衔主演</text>
  <text x="730" y="110" font-family="'SimSun',serif" font-size="20" fill="#1A1A2E" text-anchor="middle" font-weight="bold">沈腾</text>
  
  <!-- 演员名单横条 -->

  <text x="400" y="183" font-family="'SimSun',serif" font-size="16" fill="#FFD700" text-anchor="middle">蒋奇明 · 奥马尔·谢里夫 · 宁浩 · 文牧野 · 郎群力 · 钟伟</text>
  
  <!-- 底部黑色区域 -->

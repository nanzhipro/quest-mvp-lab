  <text x="400" y="1168" font-family="Arial" font-size="14" fill="#1A1A2E" text-anchor="middle" font-weight="bold">IMAX 特制拍摄</text>
  
  <!-- 底部小字 -->
  <text x="400" y="1192" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">联合出品 · 出品人 · 制作人 名单</text>
  

[workspace]
resolver = "2"
members = [
    "crates/sandbox-core",
    "crates/sandbox-center",
    "crates/sandbox-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
sandbox-core = { path = "crates/sandbox-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[profile.release]
strip = true
